services:
  postgres:
    image: postgres:16
    container_name: saas-connector-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_connector
    ports:
      - "5433:5432"
    volumes:
      - saas_connector_data:/var/lib/postgresql/data

volumes:
  saas_connector_data:
