services:
  postgres:
    image: postgres:16
    container_name: saas-connector-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_connector
    ports:
      - "5433:5432"
    volumes:
      - saas_connector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_connector"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: saas-connector-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas_connector
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  saas_connector_data:
