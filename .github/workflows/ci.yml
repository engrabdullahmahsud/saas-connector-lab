name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_connector
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_connector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/saas_connector
        run: |
          alembic upgrade head

      - name: Verify CI environment
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/saas_connector
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-for-github-actions-2026
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          python - <<'PY'
          import os
          secret = os.getenv("SECRET_KEY")
          print("SECRET_KEY configured:", secret is not None)
          print("SECRET_KEY length:", len(secret) if secret else 0)
          print("REDIS_URL:", os.getenv("REDIS_URL"))
          print("JWT_ALGORITHM:", os.getenv("JWT_ALGORITHM"))
          PY

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/saas_connector
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-for-github-actions-2026
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t saas-connector-lab:ci .
